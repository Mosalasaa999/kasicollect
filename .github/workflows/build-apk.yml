name: Build KasiCollect APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Provision Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'
        cache-disabled: true

    - name: Build Debug APK
      run: |
        cd android-app
        gradle assembleDebug -Pandroid.useAndroidX=true --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KasiCollect-Reclaimer-Edge-APK
        path: android-app/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
