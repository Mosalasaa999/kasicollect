services:
  - type: web
    name: kasicollect-api
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: frankfurt # Closest low-latency free region to South Africa
    envVars:
      - key: PORT
        value: 8443
      - key: DATABASE_URL
        fromDatabase:
          name: kasicollect-db
          property: connectionString

databases:
  - name: kasicollect-db
    plan: free
    region: frankfurt
